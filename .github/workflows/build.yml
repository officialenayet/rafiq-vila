name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project (if uploaded as a zip) and locate it
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d project_unzipped; done
          if [ -f settings.gradle.kts ]; then DIR=.; else DIR=$(dirname "$(find project_unzipped -name settings.gradle.kts | head -1)"); fi
          echo "PROJ_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project folder: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run unit tests (does not block the APK)
        continue-on-error: true
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle testDebugUnitTest --no-daemon

      - name: Build signed release APK
        working-directory: ${{ env.PROJ_DIR }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp "${{ env.PROJ_DIR }}/app/build/outputs/apk/release/app-release.apk" RAFIQ-VILA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RAFIQ-VILA-apk
          path: RAFIQ-VILA.apk

      - name: Publish to Releases (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RAFIQ VILA build ${{ github.run_number }}
          files: RAFIQ-VILA.apk
